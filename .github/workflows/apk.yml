name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm ci
      - name: Copiar el juego al proyecto Android
        run: npx cap sync android
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ThreeWorldsWar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThreeWorldsWar-apk
          path: ThreeWorldsWar.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Three Worlds War (compilación ${{ github.run_number }})
          files: ThreeWorldsWar.apk
          make_latest: true
